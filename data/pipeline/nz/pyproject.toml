[project]
name = "nz-pipeline"
version = "0.1.0"
description = "Part 2 net-zero scenario data pipeline"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pyxlsb>=1.0",
  "yfinance>=0.2.40",
  "requests>=2.31",
  "psycopg2-binary>=2.9",
  "google-genai>=2.23",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
